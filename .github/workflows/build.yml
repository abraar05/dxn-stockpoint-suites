name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & package
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dxn-release.jks"
          echo "DXN_KEYSTORE=$RUNNER_TEMP/dxn-release.jks" >> "$GITHUB_ENV"

      - name: Build debug + release + bundle
        working-directory: android/DXNStockpoint
        env:
          DXN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DXN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DXN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect artefacts
        run: |
          set -e
          mkdir -p dist
          cp android/DXNStockpoint/app/build/outputs/apk/debug/app-debug.apk \
             dist/dxn-stockpoint-3.0.0-debug.apk
          cp dist/dxn-stockpoint-3.0.0-debug.apk dist/dxn-stockpoint-latest.apk
          # Signed release only exists once the keystore secrets are configured.
          if [ -f android/DXNStockpoint/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/DXNStockpoint/app/build/outputs/apk/release/app-release.apk \
               dist/dxn-stockpoint-3.0.0.apk
          fi
          cp android/DXNStockpoint/app/build/outputs/bundle/release/app-release.aab \
             dist/dxn-stockpoint-3.0.0.aab
          ls -lh dist

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dxn-stockpoint-3.0.0
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v3.0.0' }}
          name: Mohammadpur Stock Point v3.0.0 - Web + Android, live synced
          overwrite_files: true
          body: |
            ## Mohammadpur Stock Point v3.0.0

            One revision-counter API, two clients (web + Android) that stay in
            live sync, with offline queuing on both sides.

            **Install the APK:** `dxn-stockpoint-3.0.0.apk` (signed; if absent,
            the `-debug` build sideloads the same way).

            **Web app:** https://deskamarx.github.io/dxn-stockpoint/
            **Shop server:** run `npm start` - API + web on one address.

            ### What is in this build
            - Connects out of the box - the live shop API (dxn.10001mb.com) is the built-in default; change it any time in Settings
            - Rebuilt web PWA: dashboard, POS, orders, inventory, customers, reports, tabbed settings, search palette, themes
            - Zero-dependency Node shop server (server/) with JSON persistence, or the PHP 8 + MySQL API for shared hosting
            - Changed APK icon and splash artwork
            - The shop's full 2026 DXN price list: 51 SKUs with exact DP/PV/MRP
            - Official DXN product photos for 47 SKUs (bundled offline; 4 use a generated tile)
            - Shop PIN sign-in (HMAC bearer token, 30-day expiry)
            - Offline-first: cached catalogue, queued sales, automatic replay
            - Idempotent orders (client_uuid) - a retry never double-books
            - Incremental sync on a server-wide revision counter
            - Stock ledger, low-stock alerts, dashboard, CSV exports
            - PWA installable web app sharing the exact same data

            ### First run
            1. The app connects to the live shop API automatically
            2. Tap the sync strip until it reads **Live** (only if it is offline)
            3. Unlock Admin with the shop PIN to manage stock and orders
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
